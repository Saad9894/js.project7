<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Resume - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Include Font Awesome for the eye icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            /* Updated Font */
            background: linear-gradient(45deg, #012a4a, #013a63);
            /* Gradient Background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Hide Scrollbars */
        }

        #auth-section {
            background: rgba(1, 58, 99, 0.85);
            /* Semi-Transparent Background */
            backdrop-filter: blur(10px);
            /* Glass Effect */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            /* Enhanced Shadow */
            width: 400px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
            /* Smooth Transition */
        }

        #auth-section:hover {
            transform: scale(1.03);
        }

        h3 {
            margin-bottom: 30px;
            color: #98c1d9;
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            /* Subtle Text Shadow */
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 92%;
            padding: 15px;
            border: none;
            border-bottom: 2px solid #61a5c2;
            /* Bottom Border Only */
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            /* Semi-Transparent Input */
            color: white;
            font-size: 16px;
            transition: all 0.3s ease-in-out;
            /* Smooth Transition */
        }

        input:focus {
            outline: none;
            border-bottom-color: #98c1d9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            /* Enhanced Shadow on Focus */
        }

        input::placeholder {
            color: #98c1d9;
        }

        label {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #98c1d9;
            transition: 0.3s;
            pointer-events: none;
            /* Allow clicking through label */
        }

        input:focus+label,
        input:not(:placeholder-shown)+label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            color: #61a5c2;
            background-color: #012a4a;
            /* Background Color on Floating */
            padding: 0 5px;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background: #61a5c2;
            color: #012a4a;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease-in-out, transform 0.2s ease-in-out;
            /* Added Transform */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            /* Button Shadow */
        }

        button:hover {
            background: #98c1d9;
            color: #013a63;
            transform: translateY(-2px);
            /* Lift on Hover */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            /* Enhanced Shadow on Hover */
        }

        p {
            margin-top: 20px;
            color: #98c1d9;
            font-size: 1.1em;
        }

        a {
            color: #61a5c2;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        a:hover {
            text-decoration: underline;
            color: #98c1d9;
        }

        #login-section.active,
        #register-form.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        #login-section,
        #register-form {
            display: none;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Responsive Design Adjustments */
        @media (max-width: 480px) {
            #auth-section {
                width: 90%;
                padding: 30px;
            }

            input,
            button {
                font-size: 15px;
                padding: 12px;
            }
        }

        /* Style for the password toggle icon */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #98c1d9;
        }
    </style>
</head>

<body>
    <div id="auth-section">
        <!-- Login Form -->
        <div id="login-section" class="active">
            <h3>Login</h3>
            <div class="input-group">
                <input type="email" id="login-email" placeholder=" " required>
                <label for="login-email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder=" " required>
                <label for="login-password">Password</label>
                <!-- Eye icon for toggling password visibility -->
                <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('login-password')"></i>
            </div>
            <button onclick="loginUser()">Login</button>
            <p>Don't have an account? <a href="#" onclick="toggleSection()">Register</a></p>
        </div>

        <!-- Register Form -->
        <form id="register-form">
            <h3>Register</h3>
            <div class="input-group">
                <input type="email" id="register-email" placeholder=" " required>
                <label for="register-email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="register-password" placeholder=" " required>
                <label for="register-password">Password</label>
                <!-- Eye icon for toggling password visibility -->
                <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('register-password')"></i>
            </div>
            <div class="input-group">
                <input type="text" id="register-username" placeholder=" " required>
                <label for="register-username">Username</label>
            </div>
            <button type="button" id="register-btn" onclick="registerUser()">Register</button>
            <p>Already have an account? <a href="#" onclick="toggleSection()">Login</a></p>
        </form>
    </div>

    <!-- Firebase CDN links for SDK version 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyACfUtpWAZ26Zy3Rnl5WrI8NxyOT3ew8k4",
            authDomain: "my-dynamic-cv.firebaseapp.com",
            projectId: "my-dynamic-cv",
            storageBucket: "my-dynamic-cv.firebasestorage.app",
            messagingSenderId: "1061904985626",
            appId: "1:1061904985626:web:3b867c3525b4c622bb2ba3",
            measurementId: "G-X9YER14J41"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Toggle between login and register sections
        function toggleSection() {
            const loginSection = document.getElementById("login-section");
            const registerForm = document.getElementById("register-form");

            loginSection.classList.toggle("active");
            registerForm.classList.toggle("active");
        }

        // Login user
        function loginUser() {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "register.html";
                })
                .catch(error => {
                    console.log("Error: " + error.message);
                    alert("Invalid username or password");
                });
        }

        // Register user
        async function registerUser() {
            const email = document.getElementById("register-email").value;
            const password = document.getElementById("register-password").value;
            const username = document.getElementById("register-username").value;

            const registerButton = document.getElementById("register-btn");

            if (email && password && username) {
                // Show spinner and disable button
                registerButton.disabled = true;
                registerButton.innerHTML = `
            <div class="spinner-div"> <span class="spinner"></span></div>
        `;

                try {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection("users").doc(cred.user.uid).set({
                        username: username,
                    });
                    alert("Registration successful!");
                    window.location.href = "register.html";
                } catch (error) {
                    console.log("Error: " + error.message);
                    alert("user already exist");
                } finally {
                    registerButton.disabled = false;
                    registerButton.innerHTML = 'Register';
                }
            } else {
                alert("Please fill all fields");
            }
        }

        // Function to toggle password visibility
        function togglePasswordVisibility(inputId) {
            const passwordInput = document.getElementById(inputId);
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle the eye icon
            const toggleIcon = passwordInput.nextElementSibling;
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        }
    </script>
</body>

</html>
