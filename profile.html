    <script>
        // Load profile picture from localStorage
        window.addEventListener('load', function () {
            // Load theme
            const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;
            if (currentTheme) {
                document.documentElement.setAttribute('data-theme', currentTheme);
                if (currentTheme === 'dark') {
                    themeSwitch.checked = true;
                }
            }

            //Load profile picture from localStorage
            const storedProfile = localStorage.getItem("profilePic");
            if (storedProfile) {
                document.getElementById("profilePic").src = storedProfile;
                document.getElementById("navProfilePic").src = storedProfile; // Update navbar profile pic too
            }
        });

        // Save profile picture
        function saveProfile() {
            const profileFile = document.getElementById("profileInput").files[0];

            if (!profileFile) {
                alert("Please select an image.");
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function () {
                const profileURL = reader.result;
                localStorage.setItem("profilePic", profileURL);
                document.getElementById("profilePic").src = profileURL;
                document.getElementById("navProfilePic").src = profileURL; // Update navbar profile pic too
                alert("Profile picture updated!");
            };
            reader.readAsDataURL(profileFile);
        }

                dropdown.style.display = "none";
            }
        });

        // ✅ Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ✅ Select Elements
        const loginButton = document.getElementById('login-button');
        const profileSection = document.getElementById('profile-section');
        const profileImage = document.getElementById('profile-image');
        const usernameDisplay = document.getElementById('username-display');
        const profileImageInput = document.getElementById('profile-image-input');
        const navProfilePic = document.getElementById('navProfilePic'); // Get navbar profile pic

        // ✅ Default Profile Image
        const DEFAULT_PROFILE_IMAGE = "Screenshot_2025-02-28_104148-removebg-preview.png";

        // ✅ Load User Profile (Ensures it Always Loads!)
        async function loadUserProfile(user) {
            if (!user) return;

            try {
                console.log("🔄 Fetching user profile...");

                // ✅ Try LocalStorage First for Fast Loading
                const storedUsername = localStorage.getItem("username");
                const storedProfileImage = localStorage.getItem("profileImage");

                if (storedUsername && storedProfileImage) {
                    console.log("⚡ Fast loading from LocalStorage...");
                    usernameDisplay.textContent = storedUsername;
                    profileImage.src = storedProfileImage;
                    navProfilePic.src = storedProfileImage; //Update navbar profile pic
                } else {
                    // ✅ Fetch from Firestore (Always Up-to-Date)
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();

                        // ✅ Username & Profile Image
                        const username = userData.username || user.email;
                        const profileImg = userData.profilePicURL || DEFAULT_PROFILE_IMAGE;

                        // ✅ Display on Page
                        usernameDisplay.textContent = username;
                        profileImage.src = profileImg;
                        navProfilePic.src = profileImg;

                        // ✅ Store in LocalStorage for Fast Loading
                        localStorage.setItem("username", username);
                        localStorage.setItem("profileImage", profileImg);
                    } else {
                        console.log("❌ No user data found in Firestore.");
                    }
                }
            } catch (error) {
                console.error("❌ Error loading profile:", error);
            }
        }

        // ✅ Detect Login & Load Profile
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                loginButton.style.display = 'none'; profileSection.style.display = 'flex';
                await loadUserProfile(user); // ✅ Profile will always load correctly!
            } else {
                console.log("❌ No user logged in. Showing default profile...");
                loginButton.style.display = 'block';
                profileSection.style.display = 'none';

                // Reset to Default Profile Image
                profileImage.src = DEFAULT_PROFILE_IMAGE;
                navProfilePic.src = DEFAULT_PROFILE_IMAGE

                // Clear LocalStorage on Logout
                localStorage.removeItem("username");
                localStorage.removeItem("profileImage");
            }
        });

        // ✅ Upload Profile Picture & Save it in Firestore (Fixed Saving Issue!)
        profileImageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return; // No file selected

            // **1️⃣ Show Image Preview Before Upload**
            const reader = new FileReader();
            reader.onload = (event) => {
                profileImage.src = event.target.result; // Show image instantly
                navProfilePic.src = event.target.result; //Show image in navbar instantly
            };
            reader.readAsDataURL(file);

            try {
                const user = auth.currentUser;
                if (!user) {
                    alert("You must be logged in to upload a profile picture.");
                    return;
                }

                console.log("Uploading image to Firebase...");

                // **2️⃣ Upload to Firebase Storage**
                const storageRef = storage.ref(`profileImages/${user.uid}/${file.name}`);
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();

                console.log("✅ Image uploaded. Saving URL in Firestore...");

                // **3️⃣ Save URL to Firestore (Fixed: Now it updates correctly!)**
                await db.collection('users').doc(user.uid).set({
                    profilePicURL: downloadURL
                }, {
                    merge: true
                }); // 🔥 "merge: true" to keep existing user data

                // **4️⃣ Update UI & Store in LocalStorage**
                profileImage.src = downloadURL;
                navProfilePic.src = downloadURL;
                localStorage.setItem("profileImage", downloadURL);

                console.log("✅ Profile image updated and saved!");

            } catch (error) {
                console.error("❌ Error uploading profile image:", error);
                alert('Error uploading the image. Please try again.');
            }
        });

        // ✅ Logout Function (Fixed: Now profile will appear after re-login!)
        function logout() {
            auth.signOut().then(() => {
                alert('Logged out successfully.');

                // **Clear Profile Data on Logout**
                localStorage.removeItem("username");
                localStorage.removeItem("profileImage");

                window.location.href = "index.html"; // Redirect to homepage
            }).catch((error) => {
                console.error("Logout Error", error);
            });
        }

                    localStorage.setItem('redirectAfterLogin', 'create.html');

        // Theme Switcher Functionality
        const themeSwitch = document.getElementById('themeSwitch');

        function switchTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark'); // Store dark theme
            } else {
                document.documentElement.setAttribute('data-theme', 'light'); // Use 'light' explicitly
                localStorage.setItem('theme', 'light'); // Store light theme
            }
        }

        themeSwitch.addEventListener('change', switchTheme, false);

        // Load theme from localStorage
        const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;

        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);

            if (currentTheme === 'dark') {
                themeSwitch.checked = true;
            }
        }

                "block";
