<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Profile Section */
.profile {
    position: relative;
    display: inline-block;
    cursor: pointer;
}

/* Dropdown Menu */
.dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: #ffffff;
    min-width: 120px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    border-radius: 5px;
    overflow: hidden;
    z-index: 1000;
}

.dropdown-content a {
    color: black;
    padding: 10px 15px;
    text-decoration: none;
    display: block;
    transition: 0.3s;
}

.dropdown-content a:hover {
    background-color: #f1f1f1;
}

/* Show dropdown when active */
.profile.active .dropdown-content {
    display: block;
}

    </style>
</head>
<body>
    <div class="profile" id="profileMenu">
        <img id="profilePic" src="Screenshot_2025-02-28_104148-removebg-preview.png" class="profile-pic" alt="Profile Picture" />
        <div class="dropdown-content" id="profileDropdown">
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </div>
    <script>
        // Show/hide dropdown when clicking profile pic
        document.getElementById("profilePic").addEventListener("click", function (event) {
            event.stopPropagation(); // Prevents closing when clicking inside
            document.getElementById("profileMenu").classList.toggle("active");
        });
    
        // Close dropdown if clicking outside
        window.addEventListener("click", function () {
            document.getElementById("profileMenu").classList.remove("active");
        });
    
        // Prevent dropdown from closing when clicking inside it
        document.getElementById("profileMenu").addEventListener("click", function (event) {
            event.stopPropagation();
        });
    
        // Logout function
        document.getElementById("logoutBtn").addEventListener("click", function () {
            localStorage.removeItem("userProfile");
            window.location.href = "index.html"; // Redirect to home page after logout
            alert("Logged out successfully!");
        });
    </script>
    
</body>
</html>
